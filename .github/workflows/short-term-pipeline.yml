name: Short-Term Pipeline

on:
  schedule:
    # 2 時間ごと :17（UTC, off-minute で round-number 集中 drop を回避）
    # UTC 0:17, 2:17, 4:17, 6:17, 8:17, 10:17, 12:17, 14:17, 16:17, 18:17, 20:17, 22:17
    # 米国市場時間 (UTC 14:30-21:00) 中: 14:17, 16:17, 18:17, 20:17 + 終値直後 22:17
    - cron: '17 */2 * * *'
  workflow_dispatch:

jobs:
  run-short-term:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clone private repo
        env:
          PAT_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/aa-0921/investment-advisor.git" \
            repo

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: repo
        run: uv sync --no-dev

      - name: Run Short-Term Pipeline
        working-directory: repo
        env:
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_ADDRESS: ${{ secrets.NOTIFY_EMAIL_ADDRESS }}
        run: uv run python scripts/run_short_term_pipeline.py

      - name: Persist short-term signal history and pending notifications
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/short_term_signal_history.json data/pending_notifications.json
          git diff --cached --quiet || git commit -m "chore: update short-term signal history [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Cleanup
        if: always()
        run: rm -rf repo
