name: Weekly Winrate Report

on:
  schedule:
    # 土曜 8:00 JST（UTC金曜 23:00）
    - cron: '0 23 * * 5'
  workflow_dispatch:

jobs:
  run-winrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone private repo
        env:
          PAT_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/aa-0921/investment-advisor.git" \
            repo

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: repo
        run: uv sync --no-dev

      - name: Run winrate analysis
        working-directory: repo
        env:
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_ADDRESS: ${{ secrets.NOTIFY_EMAIL_ADDRESS }}
        run: uv run python scripts/analyze_signal_winrate.py --emit-quality --email

      - name: Persist signal quality
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/signal_quality.json
          git diff --cached --quiet || git commit -m "chore: update signal quality [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Cleanup
        if: always()
        run: rm -rf repo
