name: Daily Digest

on:
  schedule:
    # UTC 23:13 = JST 8:13 (off-minute で GHA schedule drop 回避)
    - cron: '13 23 * * *'
  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clone private repo
        env:
          PAT_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/aa-0921/investment-advisor.git" \
            repo

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: repo
        run: uv sync --no-dev

      - name: Run morning digest
        working-directory: repo
        env:
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_ADDRESS: ${{ secrets.NOTIFY_EMAIL_ADDRESS }}
        run: uv run python scripts/send_morning_digest.py

      - name: Persist pending notifications (cleared after digest)
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/pending_notifications.json
          git diff --cached --quiet || git commit -m "chore: clear pending notifications after digest [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Cleanup
        if: always()
        run: rm -rf repo
