name: Crash Recovery Pipeline

on:
  schedule:
    # 6時間ごと :43（UTC, off-minute で round-number 集中 drop を回避）
    # UTC 3:43, 9:43, 15:43, 21:43 → JST 12:43, 18:43, 0:43, 6:43
    - cron: '43 3,9,15,21 * * *'
  workflow_dispatch:

jobs:
  run-crash-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Clone private repo
        env:
          PAT_TOKEN: ${{ secrets.PRIVATE_REPO_PAT }}
        run: |
          git clone \
            "https://x-access-token:${PAT_TOKEN}@github.com/aa-0921/investment-advisor.git" \
            repo

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        working-directory: repo
        run: uv sync --no-dev

      - name: Run Crash Recovery Pipeline
        working-directory: repo
        env:
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_ADDRESS: ${{ secrets.NOTIFY_EMAIL_ADDRESS }}
        run: uv run python scripts/run_crash_recovery_pipeline.py

      - name: Persist crash state and pending notifications
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crash_state.json
          git add -f data/pending_notifications.json
          git diff --cached --quiet || git commit -m "chore: update crash state [skip ci]"
          git pull --rebase --autostash || true
          git push

      - name: Cleanup
        if: always()
        run: rm -rf repo
